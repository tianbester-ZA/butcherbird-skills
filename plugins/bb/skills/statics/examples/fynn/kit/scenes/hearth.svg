<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2752" viewBox="0 0 1536 2752">
  <!-- Stand-in for a generated 9:16 scene (1536 x 2752, the size Higgsfield returns): a cabin hearth at night with
       the sock box on the floor. Like a real generation, the box label is garbled ("FYMN", "MERNIO HIKNG SOKCS"),
       and so is the small print on its side. The ad fixes both. Invented brand, drawn by hand. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16100D"/><stop offset=".62" stop-color="#2B1C15"/><stop offset="1" stop-color="#3A261A"/></linearGradient>
    <radialGradient id="glow" cx="1180" cy="1900" r="1100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF9A3C" stop-opacity=".55"/><stop offset=".5" stop-color="#C2581E" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A2F1E"/><stop offset="1" stop-color="#22150E"/></linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFE7A8"/><stop offset=".45" stop-color="#FF9B33"/><stop offset="1" stop-color="#C2410F" stop-opacity=".2"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1536" height="2752" fill="url(#wall)"/>
  <g stroke="#000" stroke-opacity=".22" stroke-width="6">
    <path d="M190 0V2160M420 0V2160M650 0V2160M880 0V2160M1110 0V2160M1340 0V2160"/>
  </g>
  <!-- stone fireplace, right -->
  <g fill="#4B4037"><rect x="1080" y="1560" width="456" height="600"/></g>
  <g fill="#5B4F45" stroke="#2A221C" stroke-width="8">
    <rect x="1080" y="1560" width="150" height="90"/><rect x="1230" y="1560" width="170" height="90"/><rect x="1400" y="1560" width="136" height="90"/>
  </g>
  <rect x="1150" y="1700" width="386" height="460" fill="#120B08"/>
  <g>
    <path d="M1190 2150 L1470 2096 L1480 2124 L1200 2178 Z" fill="#3B2416"/>
    <path d="M1210 2100 L1460 2150 L1450 2176 L1200 2128 Z" fill="#4A2E1C"/>
    <path d="M1230 2120 C1200 2040 1250 1990 1262 1900 C1290 1980 1320 2010 1312 2120 Z" fill="url(#fire)"/>
    <path d="M1290 2122 C1270 2010 1330 1950 1336 1830 C1380 1940 1410 2010 1380 2122 Z" fill="url(#fire)"/>
    <path d="M1360 2124 C1350 2050 1390 2010 1404 1940 C1430 2010 1450 2060 1428 2124 Z" fill="url(#fire)"/>
    <ellipse cx="1330" cy="2116" rx="140" ry="22" fill="#FFD27A" opacity=".55"/>
  </g>
  <rect width="1536" height="2752" fill="url(#glow)"/>
  <!-- floor -->
  <rect y="2160" width="1536" height="592" fill="url(#floor)"/>
  <g stroke="#160D08" stroke-opacity=".5" stroke-width="5"><path d="M0 2260H1536M0 2380H1536M0 2520H1536M0 2680H1536"/></g>
  <!-- contact shadow -->
  <ellipse cx="760" cy="2236" rx="520" ry="54" fill="#000" opacity=".55"/>
  <!-- the box: top, side, front -->
  <path d="M440 1620 L520 1540 L1150 1530 L1080 1610 Z" fill="#D8CDBC"/>
  <path d="M1080 1610 L1150 1530 L1160 2120 L1090 2210 Z" fill="#A99C8A"/>
  <rect x="1094" y="1700" width="52" height="300" fill="url(#shade)"/>
  <text transform="translate(1112 1720) rotate(90)" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="4" fill="#3A322B">MARINU KNTI CAEP TWON</text>
  <path d="M440 1620 L1080 1610 L1090 2210 L440 2222 Z" fill="#E9DFCE"/>
  <path d="M440 2030 L1088 2020 L1090 2210 L440 2222 Z" fill="#2F4A3A"/>
  <text x="560" y="1830" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#14110F" transform="skewY(-0.9)">FYMN</text>
  <text x="762" y="1930" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4" text-anchor="middle" fill="#14110F">MERNIO HIKNG SOKCS</text>
  <!-- fire light on the box face -->
  <path d="M440 1620 L1080 1610 L1090 2210 L440 2222 Z" fill="#FF8A2A" opacity=".08"/>
</svg>
